<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Abstract browser mockup of an interactive JavaScript project">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0A1A2E"/>
    </linearGradient>
    <linearGradient id="ac3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg3)"/>
  <!-- browser chrome -->
  <rect x="40" y="36" width="560" height="328" rx="14" fill="#0E1628" stroke="#94A3B8" stroke-opacity="0.22"/>
  <rect x="40" y="36" width="560" height="34" rx="14" fill="#0A0F1D"/>
  <rect x="40" y="56" width="560" height="14" fill="#0A0F1D"/>
  <circle cx="62" cy="53" r="5" fill="#F87171" fill-opacity="0.8"/>
  <circle cx="82" cy="53" r="5" fill="#FBBF24" fill-opacity="0.8"/>
  <circle cx="102" cy="53" r="5" fill="#34D399" fill-opacity="0.8"/>
  <rect x="126" y="45" width="380" height="16" rx="8" fill="#111B30"/>
  <rect x="138" y="50" width="110" height="6" rx="3" fill="#94A3B8" fill-opacity="0.35"/>
  <!-- interactive UI: toggle + slider + counter -->
  <rect x="64" y="92" width="220" height="12" rx="6" fill="#F8FAFC" fill-opacity="0.9"/>
  <rect x="64" y="116" width="150" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.4"/>
  <!-- toggle switch on -->
  <rect x="64" y="146" width="46" height="24" rx="12" fill="#7C3AED" fill-opacity="0.9"/>
  <circle cx="98" cy="158" r="9" fill="#F8FAFC"/>
  <rect x="122" y="153" width="90" height="8" rx="4" fill="#94A3B8" fill-opacity="0.5"/>
  <!-- toggle switch off -->
  <rect x="64" y="184" width="46" height="24" rx="12" fill="#111B30" stroke="#94A3B8" stroke-opacity="0.4"/>
  <circle cx="76" cy="196" r="9" fill="#94A3B8" fill-opacity="0.6"/>
  <rect x="122" y="191" width="70" height="8" rx="4" fill="#94A3B8" fill-opacity="0.35"/>
  <!-- slider -->
  <rect x="64" y="234" width="240" height="6" rx="3" fill="#111B30"/>
  <rect x="64" y="234" width="160" height="6" rx="3" fill="url(#ac3)"/>
  <circle cx="224" cy="237" r="10" fill="#F8FAFC" stroke="#7C3AED" stroke-width="3"/>
  <!-- buttons -->
  <rect x="64" y="268" width="88" height="26" rx="13" fill="url(#ac3)"/>
  <rect x="164" y="268" width="88" height="26" rx="13" fill="none" stroke="#38BDF8" stroke-opacity="0.55"/>
  <!-- live output panel -->
  <rect x="352" y="92" width="224" height="252" rx="12" fill="#0A0F1D" stroke="#7C3AED" stroke-opacity="0.35"/>
  <rect x="368" y="110" width="80" height="8" rx="4" fill="#38BDF8" fill-opacity="0.7"/>
  <!-- code lines -->
  <rect x="368" y="138" width="60" height="7" rx="3.5" fill="#C4B5FD" fill-opacity="0.8"/>
  <rect x="436" y="138" width="100" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.4"/>
  <rect x="384" y="156" width="80" height="7" rx="3.5" fill="#38BDF8" fill-opacity="0.6"/>
  <rect x="472" y="156" width="60" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.4"/>
  <rect x="384" y="174" width="50" height="7" rx="3.5" fill="#34D399" fill-opacity="0.7"/>
  <rect x="368" y="192" width="40" height="7" rx="3.5" fill="#C4B5FD" fill-opacity="0.8"/>
  <!-- chart -->
  <rect x="368" y="228" width="192" height="90" rx="8" fill="#111B30"/>
  <polyline points="380,296 412,272 444,284 476,252 508,264 544,238" fill="none" stroke="url(#ac3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="412" cy="272" r="4" fill="#38BDF8"/>
  <circle cx="476" cy="252" r="4" fill="#7C3AED"/>
  <circle cx="544" cy="238" r="4" fill="#38BDF8"/>
</svg>
